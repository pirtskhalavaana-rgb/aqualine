name: Deploy to Web Hoster
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Folder to publish. Empty = dist, build, out (after a build) or the repository root.
      WEBHOSTER_DIR: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
      - name: Build
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present
      - name: Package
        run: |
          DIR="$WEBHOSTER_DIR"
          echo "MODE=static" >> $GITHUB_ENV
          # Next.js (or another Node server app with a start script) without a static export: ship the built app, the server runs it
          if [ -z "$DIR" ] && [ -f package.json ] && [ ! -d out ] && { [ -d .next ] || grep -q '"start"' package.json && [ ! -d dist ] && [ ! -d build ]; } && grep -q '"start"' package.json; then
            echo "MODE=node" >> $GITHUB_ENV
            zip -qr /tmp/site.zip . -x '.git/*' 'node_modules/*' '.github/*' '.env*' '.next/cache/*'
            exit 0
          fi
          if [ -z "$DIR" ]; then
            DIR=.
            if [ -f package.json ]; then for d in dist build out; do if [ -d "$d" ]; then DIR=$d; break; fi; done; fi
          fi
          cd "$DIR" && zip -qr /tmp/site.zip . -x '.git/*' 'node_modules/*' '.github/*' '.env*'
      - name: Deploy
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://mcp.webhoster.ge" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          curl -fsS --retry 2 -X POST "https://mcp.webhoster.ge/deploy" \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@/tmp/site.zip" \
            --form-string "mode=$MODE" \
            --form-string "repo=${{ github.repository }}" \
            --form-string "commit=${{ github.sha }}" \
            --form-string "message=$MSG"
